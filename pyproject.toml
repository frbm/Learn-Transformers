[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm"
version = "0.1.0"
description = "Reference implementation for the Transformers course: shared library (src/lm) and per-module experiments."
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "regex", "matplotlib", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "tiktoken", "datasets", "pronouncing"]

[tool.setuptools.packages.find]
where = ["src"]
